<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provador Virtual - CupomClic</title>
  <style>
    :root {
      --bg-color: #0d131a;
      --card-bg: #151d27;
      --input-bg: #0b0f14;
      --border-color: #243242;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --accent-gold: #e69c5e;
      --accent-gold-hover: #d18749;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-top: 20px; }
    
    .logo-container { text-align: center; margin-bottom: 20px; }
    .logo-img { max-width: 220px; width: 100%; height: auto; border-radius: 8px; display: inline-block; }

    h1 { color: var(--accent-gold); font-size: 1.5rem; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 20px; background: var(--input-bg); padding: 18px; border-radius: 12px; border: 1px solid var(--border-color); }
    label { display: block; font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
    
    /* BOTÕES DUPLOS (CÂMERA E GALERIA) */
    .file-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn-upload { background: #1e293b; border: 1px solid #334155; color: var(--text-main); padding: 12px 8px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-upload:hover { background: #334155; border-color: var(--accent-gold); }
    
    /* INPUTS OCULTOS */
    input[type="file"] { display: none; }
    
    .preview-filename { font-size: 0.8rem; color: var(--accent-green); margin-top: 8px; display: none; text-align: center; font-weight: bold; }

    select { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid #1e3a5f; border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; }
    
    .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent-gold), #c47c3e); border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
    .btn-main:hover { opacity: 0.95; }
    .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

    .loading-box { display: none; text-align: center; padding: 25px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; margin-top: 25px; }
    .spinner { width: 45px; height: 45px; border: 4px solid var(--border-color); border-top: 4px solid var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 0.95rem; color: var(--accent-gold); font-weight: bold; }
    .loading-subtext { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

    .results-container { margin-top: 25px; display: none; text-align: center; }
    .img-preview { width: 100%; max-width: 450px; border-radius: 12px; border: 2px solid var(--accent-gold); margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
    .btn-download { display: inline-block; width: 100%; text-align: center; background: var(--accent-gold); color: #000; padding: 14px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="CupomClic" class="logo-img">
    </div>

    <h1>👗 PROVADOR VIRTUAL</h1>
    <p class="subtitle">Veja como qualquer roupa fica na cliente instantaneamente com IA</p>

    <!-- ETAPA 1: FOTO DA CLIENTE -->
    <div class="form-group">
      <label>1. FOTO DA CLIENTE OU MODELO:</label>
      <div class="file-buttons">
        <label for="clienteCam" class="btn-upload">📸 Abrir Câmera</label>
        <label for="clienteFile" class="btn-upload">📁 Galeria / Arquivo</label>
      </div>
      <input type="file" id="clienteCam" accept="image/*" capture="user" onchange="atualizarStatus('cliente', this)">
      <input type="file" id="clienteFile" accept="image/*" onchange="atualizarStatus('cliente', this)">
      <div id="statusCliente" class="preview-filename"></div>
    </div>

    <!-- ETAPA 2: FOTO DA ROUPA -->
    <div class="form-group">
      <label>2. FOTO DA ROUPA (CABIDE OU FOTO PLANO):</label>
      <div class="file-buttons">
        <label for="roupaCam" class="btn-upload">📸 Tirar Foto</label>
        <label for="roupaFile" class="btn-upload">📁 Galeria / Arquivo</label>
      </div>
      <input type="file" id="roupaCam" accept="image/*" capture="environment" onchange="atualizarStatus('roupa', this)">
      <input type="file" id="roupaFile" accept="image/*" onchange="atualizarStatus('roupa', this)">
      <div id="statusRoupa" class="preview-filename"></div>
    </div>

    <!-- ETAPA 3: CATEGORIA -->
    <div class="form-group">
      <label>3. TIPO DA PEÇA DE VESTUÁRIO:</label>
      <select id="categoriaSelect">
        <option value="upper_body">👔 Parte de Cima (Camisas, Blusas, Jaquetas)</option>
        <option value="lower_body">👖 Parte de Baixo (Calças, Bermudas, Saias)</option>
        <option value="dresses">👗 Peça Única / Vestidos / Macacões</option>
      </select>
    </div>

    <button id="btnProvar" class="btn-main" onclick="provarRoupa()">⚡ Provar Roupa Agora</button>

    <div id="loadingBox" class="loading-box">
      <div class="spinner"></div>
      <div class="loading-text">👗 "Vestindo" a peça na modelo com IA...</div>
      <div class="loading-subtext">Ajustando caimento, sombras e dobras do tecido. Aguarde de 8 a 12 segundos.</div>
    </div>

    <div id="resultsBox" class="results-container">
      <img id="fotoResultado" class="img-preview" src="" alt="Resultado da Prova Virtual">
      <a id="btnDownload" class="btn-download" href="#" download="provador-cupomclic.jpg" target="_blank">⬇️ Baixar Foto do Provador (Enviar no WhatsApp)</a>
    </div>
  </div>

  <script>
    // Guarda os arquivos selecionados
    let arquivoCliente = null;
    let arquivoRoupa = null;

    function atualizarStatus(tipo, input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (tipo === 'cliente') {
          arquivoCliente = file;
          const status = document.getElementById('statusCliente');
          status.innerText = '✅ Foto da cliente selecionada: ' + file.name;
          status.style.display = 'block';
        } else if (tipo === 'roupa') {
          arquivoRoupa = file;
          const status = document.getElementById('statusRoupa');
          status.innerText = '✅ Foto da roupa selecionada: ' + file.name;
          status.style.display = 'block';
        }
      }
    }

    function comprimirImagem(file, maxWidth = 1024, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = err => reject(err);
        };
        reader.onerror = err => reject(err);
      });
    }

    async function provarRoupa() {
      const categoriaSelect = document.getElementById('categoriaSelect');
      const btn = document.getElementById('btnProvar');
      const loadingBox = document.getElementById('loadingBox');
      const resultsBox = document.getElementById('resultsBox');
      const fotoResultado = document.getElementById('fotoResultado');
      const btnDownload = document.getElementById('btnDownload');

      if (!arquivoCliente || !arquivoRoupa) {
        alert('Por favor, selecione TANTO a foto da cliente QUANTO a foto da roupa!');
        return;
      }

      btn.disabled = true;
      btn.innerText = '⏳ Otimizando fotos e enviando...';
      resultsBox.style.display = 'none';
      loadingBox.style.display = 'block';

      try {
        const pessoaBase64 = await comprimirImagem(arquivoCliente);
        const roupaBase64 = await comprimirImagem(arquivoRoupa);

        const res = await fetch('/api/provador', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            human_image: pessoaBase64,
            garment_image: roupaBase64,
            category: categoriaSelect.value,
            description: 'fashion clothing garment'
          })
        });

        const data = await res.json();

        if (data.sucesso && data.imageUrl) {
          fotoResultado.src = data.imageUrl;
          btnDownload.href = data.imageUrl;
          resultsBox.style.display = 'block';
        } else {
          alert('Atenção: ' + (data.erro || 'Erro ao processar a prova virtual.'));
        }
      } catch (err) {
        console.error('Erro:', err);
        alert('Erro de conexão ao processar imagem.');
      } finally {
        loadingBox.style.display = 'none';
        btn.disabled = false;
        btn.innerText = '⚡ Provar Roupa Agora';
      }
    }
  </script>
</body>
</html>
